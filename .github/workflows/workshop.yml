name: SkillHub browser checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  accounts:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillhub
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: skillhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: production
      DATABASE_URL: postgresql://skillhub:ci-password@127.0.0.1:5432/skillhub?sslmode=disable
      SESSION_SECRET: isolated-accounts-ci-signing-key-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_account_lifecycle

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save playwright@1.56.1
      - name: Start test server
        run: |
          python server.py > /tmp/skillhub-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/skillhub-server.log
          exit 1
      - name: Check learning path and assets
        run: |
          curl --fail --silent --show-error --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o /tmp/skillhub-three.min.js
          export SKILLHUB_CHROME="$(command -v google-chrome)"
          google-chrome --version
          SKILLHUB_THREE=/tmp/skillhub-three.min.js node test_workshop_browser.cjs
