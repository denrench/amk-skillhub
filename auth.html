<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вход и Регистрация — АМК SkillHub (Google Stitch Edition)</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Google+Sans+Display:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Google+Sans+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-modal);
      position: relative;
      overflow: hidden;
    }
    .auth-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--stitch-gradient-rainbow);
    }
    .role-switcher-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .role-tab-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .role-tab-btn.active {
      background: var(--google-blue);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(66, 133, 244, 0.35);
    }
    .auth-mode-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .auth-mode-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .auth-mode-btn.active {
      color: #fff;
      border-bottom-color: var(--google-blue);
    }
    .input-field {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition-fast);
      margin-bottom: 14px;
    }
    .input-field:focus {
      border-color: var(--border-active);
      box-shadow: 0 0 12px rgba(66, 133, 244, 0.2);
    }
    .field-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .quick-logins-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <!-- Google Stitch Rainbow Accent Strip -->
  <div class="stitch-rainbow-strip"></div>

  <!-- Header -->
  <header class="navbar">
    <div class="container nav-content">
      <div style="display: flex; align-items: center; gap: 16px;">
        <a href="index.html" class="btn btn-secondary" style="padding: 6px 14px; font-size: 0.82rem;" title="На главную">
          <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
          <span>Главная</span>
        </a>
        <a href="index.html" class="brand">
          <div class="brand-badge">АМК</div>
          <div class="brand-info">
            <span class="brand-name">SkillHub <span class="brand-stitch-tag">Stitch</span></span>
          </div>
        </a>
      </div>

      <div class="nav-actions">
        <!-- Live Backend Status Pill -->
        <div id="backendStatusPill" class="api-status-pill" title="Статус сервера SQLite3">
          <span class="pulse-dot"></span>
          <span>SQLite3 Онлайн</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Auth Container -->
  <div class="auth-wrapper">
    <div class="auth-box">

      <!-- Role Switcher (Student vs Teacher) -->
      <div class="role-switcher-tabs">
        <button class="role-tab-btn active" id="tabRoleStudent">
          <span class="material-symbols-outlined" style="font-size: 18px;">school</span>
          <span>Студент</span>
        </button>
        <button class="role-tab-btn" id="tabRoleTeacher">
          <span class="material-symbols-outlined" style="font-size: 18px;">person_outline</span>
          <span>Преподаватель</span>
        </button>
      </div>

      <!-- Mode Switcher (Login vs Register) -->
      <div class="auth-mode-tabs">
        <div class="auth-mode-btn active" id="btnModeLogin">Вход в систему</div>
        <div class="auth-mode-btn" id="btnModeRegister">Регистрация</div>
      </div>

      <!-- Auth Form -->
      <form id="authForm">
        <!-- Full name (only for registration) -->
        <div id="groupFullName" style="display: none;">
          <label class="field-label">Фамилия и Имя (ФИО):</label>
          <input type="text" id="inputFullName" class="input-field" placeholder="Напр. Асылхан Бауыржанұлы">
        </div>

        <!-- Email -->
        <div>
          <label class="field-label">Электронная почта (Email):</label>
          <input type="email" id="inputEmail" class="input-field" placeholder="student@amk.kz" required>
        </div>

        <!-- Password -->
        <div>
          <label class="field-label">Пароль:</label>
          <input type="password" id="inputPassword" class="input-field" placeholder="••••••••" required>
        </div>

        <!-- Group Name (Student registration only) -->
        <div id="groupStudentGroup" style="display: none;">
          <label class="field-label">Учебная группа колледжа:</label>
          <select id="selectGroup" class="input-field" style="cursor: pointer;">
            <option value="ПО-22">ПО-22 (06130100 Программное обеспечение)</option>
            <option value="АВ-21">АВ-21 (07161300 Автодиагностика ДВС)</option>
            <option value="ХО-20">ХО-20 (07150900 Холодильные установки)</option>
            <option value="ДИ-21">ДИ-21 (02110300 Графический дизайн)</option>
            <option value="МЕ-20">МЕ-20 (07221400 ЧПУ Раскрой мебели)</option>
          </select>
        </div>

        <!-- Teacher Secret Key (Teacher registration only) -->
        <div id="groupTeacherKey" style="display: none;">
          <label class="field-label">
            Секретный код преподавателя АМК:
            <span style="color: var(--google-yellow); font-size: 0.75rem;">(Код: AMK-TEACHER-2026)</span>
          </label>
          <input type="text" id="inputTeacherKey" class="input-field" placeholder="AMK-TEACHER-2026">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" id="btnSubmitAuth" style="width: 100%; padding: 12px; margin-top: 6px; font-size: 0.95rem;">
          <span class="material-symbols-outlined" style="font-size: 18px;">login</span>
          <span id="submitBtnText">Войти в личный кабинет</span>
        </button>
      </form>

      <!-- Quick Fill Buttons for Instant Demonstration -->
      <div class="quick-logins-box">
        <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em; display: block; text-align: center; margin-bottom: 10px;">
          Быстрый демонстрационный вход:
        </span>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" id="btnQuickStudent" style="flex: 1; padding: 6px 10px; font-size: 0.78rem;">
            🎓 Студент (ПО-22)
          </button>
          <button class="btn btn-secondary" id="btnQuickTeacher" style="flex: 1; padding: 6px 10px; font-size: 0.78rem; border-color: rgba(14, 165, 233, 0.4); color: #38bdf8;">
            👨‍🏫 Преподаватель
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentRole = 'student'; // 'student' or 'teacher'
      let currentMode = 'login';   // 'login' or 'register'

      // DOM Elements
      const tabRoleStudent = document.getElementById('tabRoleStudent');
      const tabRoleTeacher = document.getElementById('tabRoleTeacher');
      const btnModeLogin = document.getElementById('btnModeLogin');
      const btnModeRegister = document.getElementById('btnModeRegister');
      const groupFullName = document.getElementById('groupFullName');
      const groupStudentGroup = document.getElementById('groupStudentGroup');
      const groupTeacherKey = document.getElementById('groupTeacherKey');
      const submitBtnText = document.getElementById('submitBtnText');
      const authForm = document.getElementById('authForm');
      const inputEmail = document.getElementById('inputEmail');
      const inputPassword = document.getElementById('inputPassword');
      const inputFullName = document.getElementById('inputFullName');
      const selectGroup = document.getElementById('selectGroup');
      const inputTeacherKey = document.getElementById('inputTeacherKey');

      // Update Form View
      function updateView() {
        tabRoleStudent.classList.toggle('active', currentRole === 'student');
        tabRoleTeacher.classList.toggle('active', currentRole === 'teacher');
        btnModeLogin.classList.toggle('active', currentMode === 'login');
        btnModeRegister.classList.toggle('active', currentMode === 'register');

        const isReg = currentMode === 'register';
        groupFullName.style.display = isReg ? 'block' : 'none';
        groupStudentGroup.style.display = (isReg && currentRole === 'student') ? 'block' : 'none';
        groupTeacherKey.style.display = (isReg && currentRole === 'teacher') ? 'block' : 'none';

        if (isReg) {
          submitBtnText.textContent = currentRole === 'teacher' ? 'Зарегистрировать преподавателя' : 'Зарегистрировать студента';
        } else {
          submitBtnText.textContent = 'Войти в личный кабинет';
        }
      }

      tabRoleStudent.onclick = () => { currentRole = 'student'; updateView(); };
      tabRoleTeacher.onclick = () => { currentRole = 'teacher'; updateView(); };
      btnModeLogin.onclick = () => { currentMode = 'login'; updateView(); };
      btnModeRegister.onclick = () => { currentMode = 'register'; updateView(); };

      // Quick Demos
      document.getElementById('btnQuickStudent').onclick = () => {
        currentRole = 'student';
        currentMode = 'login';
        inputEmail.value = 'student@amk.kz';
        inputPassword.value = 'student123';
        updateView();
        showToast('Заполнены данные студента Асылхана (ПО-22)');
      };

      document.getElementById('btnQuickTeacher').onclick = () => {
        currentRole = 'teacher';
        currentMode = 'login';
        inputEmail.value = 'teacher@amk.kz';
        inputPassword.value = 'admin123';
        updateView();
        showToast('Заполнены данные преподавателя кафедры ТиПО');
      };

      // Form Submit
      authForm.onsubmit = (e) => {
        e.preventDefault();
        const email = inputEmail.value.trim();
        const password = inputPassword.value.trim();

        if (currentMode === 'login') {
          fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          })
          .then(r => r.json())
          .then(d => {
            if (d.success) {
              localStorage.setItem('amk_current_user', JSON.stringify(d.user));
              showToast(d.message || 'Успешный вход!', 'success');
              setTimeout(() => {
                window.location.href = d.user.role === 'teacher' ? 'teacher.html' : 'simulator.html';
              }, 600);
            } else {
              showToast(d.message || 'Ошибка авторизации', 'error');
            }
          })
          .catch(() => {
            // Local fallback
            const demoUser = {
              id: currentRole === 'teacher' ? 1 : 2,
              full_name: currentRole === 'teacher' ? 'Иванов Сергей Павлович' : 'Асылхан Бауыржанұлы',
              email: email,
              role: currentRole,
              group_name: currentRole === 'teacher' ? 'Кафедра ТиПО' : 'ПО-22',
              student_id: currentRole === 'teacher' ? 'TEACHER-AMK-01' : 'KZ-AMK-2026-98421'
            };
            localStorage.setItem('amk_current_user', JSON.stringify(demoUser));
            showToast('Успешный вход (Оффлайн режим)', 'success');
            setTimeout(() => {
              window.location.href = currentRole === 'teacher' ? 'teacher.html' : 'simulator.html';
            }, 600);
          });
        } else {
          // Register
          const full_name = inputFullName.value.trim();
          const group_name = selectGroup.value;
          const teacher_key = inputTeacherKey.value.trim();

          fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email,
              password,
              full_name,
              role: currentRole,
              group_name,
              teacher_key
            })
          })
          .then(r => r.json())
          .then(d => {
            if (d.success) {
              localStorage.setItem('amk_current_user', JSON.stringify(d.user));
              showToast(d.message || 'Регистрация успешна!', 'success');
              setTimeout(() => {
                window.location.href = d.user.role === 'teacher' ? 'teacher.html' : 'simulator.html';
              }, 600);
            } else {
              showToast(d.message || 'Ошибка регистрации', 'error');
            }
          })
          .catch(() => {
            showToast('Сервер недоступен, регистрация сохранена локально', 'info');
          });
        }
      };

      function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = `toast ${type === 'success' ? 'toast-success' : (type === 'error' ? 'toast-error' : '')}`;
        toast.innerHTML = `<span class="material-symbols-outlined" style="font-size: 18px;">${type === 'success' ? 'check_circle' : (type === 'error' ? 'error' : 'info')}</span><span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 250);
        }, 3200);
      }

      updateView();
    });
  </script>
</body>
</html>
