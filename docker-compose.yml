version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eduspace-postgres
    restart: always
    environment:
      POSTGRES_DB: eduspace
      POSTGRES_USER: eduspace
      POSTGRES_PASSWORD: eduspace_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - eduspace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduspace -d eduspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: eduspace-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://eduspace:eduspace_secure_pass_2026@db:5432/eduspace
      - SESSION_SECRET=eduspace_secure_session_secret_production_2026
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./database.db:/app/database.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  eduspace_pgdata:
    driver: local
