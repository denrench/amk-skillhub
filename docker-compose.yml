version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eduspace-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduspace}
      POSTGRES_USER: ${POSTGRES_USER:-eduspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - eduspace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduspace} -d ${POSTGRES_DB:-eduspace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: eduspace-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduspace}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-eduspace}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - UPLOAD_DIR=/app/static/uploads/submissions
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  eduspace_pgdata:
    driver: local
